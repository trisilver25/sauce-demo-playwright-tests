name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        env:
          SAUCE_DEMO_USER: ${{secrets.SAUCE_DEMO_USER}}
          SAUCE_DEMO_PASS: ${{secrets.SAUCE_DEMO_PASS}}
          SAUCE_ERROR_USER: ${{secrets.SAUCE_ERROR_USER}}
          SAUCE_ERROR_PASS: ${{secrets.SAUCE_ERROR_PASS}}
          SAUCE_LOCKED_USER: ${{secrets.SAUCE_LOCKED_USER}}
          SAUCE_LOCKED_PASS: ${{secrets.SAUCE_LOCKED_PASS}}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
